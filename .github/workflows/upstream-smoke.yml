name: Upstream Zi smoke

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare smoke evidence directory
        id: evidence
        shell: sh
        run: |
          set -eu
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/upstream-smoke-evidence.XXXXXX")"
          printf 'path=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Run real-Zi smoke
        id: smoke
        env:
          UPSTREAM_SMOKE_EVIDENCE_DIR: ${{ steps.evidence.outputs.path }}
        run: zsh tests/upstream-smoke.zsh

      - name: Upload smoke evidence
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-smoke-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
          include-hidden-files: false

  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Zsh
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends zsh

      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare smoke evidence directory
        id: evidence
        shell: sh
        run: |
          set -eu
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/upstream-smoke-evidence.XXXXXX")"
          printf 'path=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Run real-Zi smoke
        id: smoke
        env:
          UPSTREAM_SMOKE_EVIDENCE_DIR: ${{ steps.evidence.outputs.path }}
        run: zsh tests/upstream-smoke.zsh

      - name: Upload smoke evidence
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-smoke-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
          include-hidden-files: false

  cachyos-current:
    name: CachyOS current
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # This advisory lane intentionally tracks current CachyOS; required CI pins its digest.
      image: cachyos/cachyos:latest
    steps:
      - name: Install Zsh
        run: pacman -Syu --noconfirm --needed zsh

      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare smoke evidence directory
        id: evidence
        shell: sh
        run: |
          set -eu
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/upstream-smoke-evidence.XXXXXX")"
          printf 'path=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Run real-Zi smoke
        id: smoke
        env:
          UPSTREAM_SMOKE_EVIDENCE_DIR: ${{ steps.evidence.outputs.path }}
        run: /usr/bin/zsh tests/upstream-smoke.zsh

      - name: Upload smoke evidence
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-smoke-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
          include-hidden-files: false
